{% extends "base/base.html" %}
{% load static %}

{% block content %}
<p>Contenido del Index index.html</p>
<canvas id="chart" width="400" height="100">

</canvas>
{% endblock content %}
{% block js %}
<script>
    const ctx = document.getElementById('chart')

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
                label: '# of Votes',
                data: [12, 19, 3, 5, 2, 3],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
{% endblock js %}
