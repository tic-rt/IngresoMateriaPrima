{% extends "base/base.html" %}
{% load static %}

{% block content %}
<!-- Grafico de cantidad de camiones ingresados -->
<div class="container text-center mt-5 mb-4">
    <h2 class="bold">Cant. de camiones por Materia Prima</h2>
</div>
<div class="container text-center card-body shadow p-3 mb-5 bg-body rounded border border-2">
    <canvas class="center" id="cantCamiones" width="400" height="100">

</canvas>
</div>

<!-- Grafico de camiones ingresados y en transito -->
<div class="container text-center mt-5 mb-4 pt-5">
    <h2 class="bold">Vehiculos en Transito</h2>
</div>
<div class="container text-center card-body shadow p-3 mb-5 bg-body rounded border border-2">
    <canvas class="center" id="transito" width="400" height="400">

</canvas>
</div>

{% endblock content %}
{% block js %}
<script>
document.addEventListener('DOMContentLoaded', function () {

    let chartCamiones = null;
    let chartTransito = null;

    function leerDatos() {

        // -------------------------
        // CAMIONES
        // -------------------------
        fetch('{% url "cantidad_camiones" %}')
            .then(response => response.json())
            .then(data => {

                const valores = data.data || [];

                const ctx = document.getElementById('cantCamiones').getContext('2d');

                if (chartCamiones) chartCamiones.destroy();

                chartCamiones = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels || [],
                        datasets: [{
                            label: "Cantidad de camiones hoy",
                            data: valores,
                            backgroundColor: [
                                'rgba(75, 192, 192, 0.2)',
                                'rgba(255, 206, 86, 0.2)',
                                'rgba(153, 102, 255, 0.2)',
                                'rgba(255, 99, 132, 0.2)'
                            ],
                            borderColor: [
                                'rgba(75, 192, 192, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 99, 132, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    precision: 0
                                }
                            }
                        }
                    }
                });
            });


        // -------------------------
        // TRÁNSITO
        // -------------------------
        fetch('{% url "transito" %}')
            .then(response => response.json())
            .then(data => {

                const valores = data.data || [];

                const ctx = document.getElementById('transito').getContext('2d');

                if (chartTransito) chartTransito.destroy();

                // Si no hay datos, mostrar gráfico vacío controlado
                const sinDatos = valores.length === 0 || valores.every(v => v === 0);

                if (sinDatos) {
                    chartTransito = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Sin vehículos'],
                            datasets: [{
                                data: [1],
                                backgroundColor: ['rgba(200,200,200,0.3)'],
                                borderColor: ['rgba(200,200,200,1)'],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '60%'
                        }
                    });

                    return;
                }

                chartTransito = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels || [],
                        datasets: [{
                            label: 'Vehículos en tránsito',
                            data: valores,
                            backgroundColor: [
                                'rgba(240, 243, 32,0.3)',
                                'rgba(43, 243, 32,0.3)',
                                'rgba(255, 99, 132, 0.3)'
                            ],
                            borderColor: [
                                'rgba(240, 243, 32, 1)',
                                'rgba(43, 243, 32, 1)',
                                'rgba(255, 99, 132, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '60%'
                    }
                });
            });
    }

    // Primera carga
    setTimeout(leerDatos, 1000);

});
</script>
{% endblock js %}
