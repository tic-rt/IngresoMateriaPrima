{% extends "base/base.html" %}
{% load static %}

{% block content %}
<!-- Grafico de cantidad de camiones ingresados -->
<div class="container text-center mt-5 mb-4">
    <h2 class="bold">Cant. de camiones por Materia Prima</h2>
</div>
<div class="container text-center card-body shadow p-3 mb-5 bg-body rounded border border-2">
    <canvas class="center" id="cantCamiones" width="400" height="100">

</canvas>
</div>

<!-- Grafico de camiones ingresados y en transito -->
<div class="container text-center mt-5 mb-4 pt-5">
    <h2 class="bold">Vehiculos en Transito</h2>
</div>
<div class="container text-center card-body shadow p-3 mb-5 bg-body rounded border border-2">
    <canvas class="center" id="transito" width="400" height="400">

</canvas>
</div>

{% endblock content %}
{% block js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function leerDatos(){
            fetch('{% url "cantidad_camiones" %}')
            .then(response => response.json())
            .then(data => {
                const cantCamiones = document.getElementById('cantCamiones').getContext('2d');
                const chart = new Chart(cantCamiones, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label:"Cantidad de camiones hoy",
                            data: data.data,
                            backgroundColor: [
                                'rgba(75, 192, 192, 0.2)',
                                'rgba(255, 206, 86, 0.2)',
                                'rgba(153, 102, 255, 0.2)',
                                'rgba(255, 99, 132, 0.2)'
                            ],
                            borderColor: [
                                'rgba(75, 192, 192, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 99, 132, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        label:false,
                        borderWidth:1,
                        borderWidth:1,
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    precision: 0
                                }
                            }
                        }
                    }
                });
            });
            fetch('{% url "transito" %}')
            .then(response => response.json())
            .then(data => {
                const transito = document.getElementById('transito').getContext('2d');
                const chart = new Chart(transito, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Vehiculos en tránsito',
                            data: data.data,
                            backgroundColor: [
                                'rgba(240, 243, 32,0.3)',
                                'rgba(43, 243, 32,0.3)',
                                'rgba(255, 99, 132, 0.3)'
                            ],
                            borderColor: [
                                'rgba(240, 243, 32, 1)',
                                'rgba(43, 243, 32, 1)',
                                'rgba(255, 99, 132, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        borderWidth:1,
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '60%'
                    }
                });
            });
        }
        timer = setTimeout(leerDatos(), 1000); // Espera 1 segundo antes de la primera llamada
        
    });
</script>
{% endblock js %}
