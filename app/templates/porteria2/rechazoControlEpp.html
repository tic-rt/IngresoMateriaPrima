{% extends 'base/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-fluid">
    <div class="container fondo-epp mt-5" style="height: 100px;"></div>
    <div class="container text-center">
        <div>
            <h3>Rechazo Control EPP</h3>
        </div>
        <div class="d-flex justify-content-center mb-5">
            <div class="col-10 col-sm-8 ">
                <div class="row">
                    <div class="col-6">
                        <label class="form-label" for="empresa">Empresa</label>
                        <input class="form-control" type="text" disabled value="{{empresa_transporte}}" id="empresa">
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="producto">Producto</label>
                        <input class="form-control" type="text" disabled value="{{producto}}" id="producto">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-6">
                        <label class="form-label" for="patente_chasis">Camión</label>
                        <input class="form-control" type="text" disabled value="{{patente_chasis}}" id="patente_chasis">
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="patente_semi">Semi</label>
                        <input class="form-control" type="text" disabled value="{{patente_semi}}" id="patente_semi">
                    </div>
                </div>
                <div class="bg-warning-subtle mt-5 border border-1 border-warning d-flex align-items-center justify-content-center d-block"
                    style="height: 90px;" id="noValidado">
                    <p><strong>Si uno o varios elementos no son marcados el ingreso sera guardado como rechazado</strong></p>
                </div>
                
                <div class="row">
                    <form action="{% url 'guardarControlEpp' %}?id_hdr={{id_hdr}}&id_ingreso={{id_ingreso}}" method="POST" readonly>
                        <div class="row">
                            {% csrf_token %}
                            {% crispy form_epp %}
                        </div>
                    </form>
                </div>
                <div>
                    <button class="btn btn-danger float-end bi-arrow-left-circle"
                        onclick="window.location.replace('{% url 'nuevoIngreso' %}');"> Regresar</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>

</script>
{% endblock js %}
