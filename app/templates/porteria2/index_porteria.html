{% extends "base/base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <!-- Filtros de período -->
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-center">
            <div class="btn-group" role="group" aria-label="Filtro de período">
                <button type="button" class="btn btn-outline-primary active" data-periodo="hoy" onclick="cambiarPeriodo('hoy', this)">Hoy</button>
                <button type="button" class="btn btn-outline-primary" data-periodo="semana" onclick="cambiarPeriodo('semana', this)">Semanal</button>
                <button type="button" class="btn btn-outline-primary" data-periodo="mensual" onclick="cambiarPeriodo('mensual', this)">Mensual</button>
            </div>
        </div>
    </div>

    <!-- Fila 1: Charts doughnut -->
    <div class="row justify-content-around shadow-lg rounded pt-3 mb-3">
         <!--Grafico 1-->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white text-center">
                    <h5 class="mb-0">Ingresados por Empresa</h5>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center">
                    <canvas id="chartIngresadosHoy"></canvas>
                </div>
            </div>
        </div>
        <!--Grafico 2-->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-info text-white text-center">
                    <h5 class="mb-0">En Tránsito por Producto</h5>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center">
                    <canvas id="chartEnTransito" ></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Fila 2: Cards de resumen -->
    <div class="row mb-4">
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-danger h-100" style="box-shadow: 0px 0px 20px 0px black;">
                <div class="card-body text-center">
                    <h2 class="card-title" id="totalRechazados">0</h2>
                    <p class="card-text mb-0">Vehículos Rechazados</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-primary h-100" style="box-shadow: 0px 0px 20px 0px black;">
                <div class="card-body text-center">
                    <h2 class="card-title" id="totalIngresados">0</h2>
                    <p class="card-text mb-0">Total Ingresados</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-success h-100" style="box-shadow: 0px 0px 20px 0px black;">
                <div class="card-body text-center">
                    <h2 class="card-title" id="totalTransito">0</h2>
                    <p class="card-text mb-0">En Tránsito</p>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-white bg-secondary h-100" style="box-shadow: 0px 0px 20px 0px black;">
                <div class="card-body text-center">
                    <h2 class="card-title" id="totalFinalizados">0</h2>
                    <p class="card-text mb-0">Finalizados</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% block js %}
{{ block.super }}
<script>
// Paletas de colores
const coloresEmpresa = ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b', '#5a5c69', '#858796'];
const coloresProducto = ['#6f42c1', '#fd7e14', '#20c997', '#e83e8c', '#17a2b8', '#6610f2', '#28a745'];

// Variables globales para los charts (para poder destruirlos y recrearlos)
let chartIngresados = null;
let chartTransito = null;

function cargarDashboard(periodo) {
    const url = `{% url 'dashboard_json' %}?periodo=${periodo}`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            // Actualizar cards
            document.getElementById('totalIngresados').textContent = data.total_ingresados;
            document.getElementById('totalTransito').textContent = data.total_transito;
            document.getElementById('totalRechazados').textContent = data.total_rechazados;
            document.getElementById('totalFinalizados').textContent = data.total_finalizados;

            // Destruir charts anteriores si existen
            if (chartIngresados) {
                chartIngresados.destroy();
            }
            if (chartTransito) {
                chartTransito.destroy();
            }

            // ---- Chart 1: Ingresados por Empresa ----
            const ctx1 = document.getElementById('chartIngresadosHoy').getContext('2d');
            chartIngresados = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: data.ingresados_por_empresa.labels,
                    datasets: [{
                        data: data.ingresados_por_empresa.data,
                        backgroundColor: coloresEmpresa.slice(0, data.ingresados_por_empresa.labels.length),
                        borderColor: '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 10, font: { size: 16 } }
                        }
                    }
                }
            });

            // ---- Chart 2: En Tránsito por Producto ----
            const ctx2 = document.getElementById('chartEnTransito').getContext('2d');
            chartTransito = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: data.en_transito_por_producto.labels,
                    datasets: [{
                        data: data.en_transito_por_producto.data,
                        backgroundColor: coloresProducto.slice(0, data.en_transito_por_producto.labels.length),
                        borderColor: '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 10, font: { size: 16 } }
                        }
                    }
                }
            });
        })
        .catch(error => console.error('Error al cargar dashboard:', error));
}

function cambiarPeriodo(periodo, btn) {
    // Actualizar clase active en los botones
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Recargar dashboard con el nuevo período
    cargarDashboard(periodo);
}

// Cargar dashboard al iniciar con período 'hoy'
document.addEventListener('DOMContentLoaded', function() {
    cargarDashboard('hoy');
});
</script>
{% endblock js %}
