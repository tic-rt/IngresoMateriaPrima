{% extends "base/base.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container-fluid d-flex flex-column mb-5">
    
    <div class="container fondo-conductores" style="height: 100px;"></div>


    <!-- Formulario de edicion -->
    <div class="text-center pt-4 mb-5">
        <div class="d-flex justify-content-center">
            <div class="col-10 col-sm-8">
                <div class="text-center mb-4">
                    <h3>Editando Agente</h3>
                </div>
                <form method="post" action="{% url 'actualizar' %}">
                    <input type="hidden" name="id" value="{{ form_editar.instance.id }}">
                    {% csrf_token %}
                    {{ form_editar|crispy }}
                    <button type="submit" class="btn btn-primary">Guardar</button>   
                </form>
                <div class="mt-4">
                    <button class="btn btn-success" onclick="history.back()" id="volver"><i class="bi bi-arrow-left  me-4"></i>Volver</button>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock content %}

{% block js %}
<script>
    document.addEventListener('DomContentLoaded', function() {
        document.getElementById('volver').addEventListener('click', function(){

        })
    })
</script>
{% endblock js %}
