<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <!-- Bootstrap -->
    <!-- <link rel="stylesheet" href="/app/static/vendor/bootstrap-5.3.2-dist/css/bootstrap.css"> -->
    <!-- <script src="/app/static/vendor/bootstrap-5.3.2-dist/js/bootstrap.js"></script> -->
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-5.3.2-dist/css/bootstrap.css' %}">
    <script src="{% static 'vendor/bootstrap-5.3.2-dist/js/bootstrap.bundle.js' %}"></script>
    <!-- css -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <title>Loguin</title>
</head>
<body class="fondo-loguin">
    <div class="container">
        <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
            
            <div class="border border-2 p-5 rounded-4 d-flex justify-content-center align-items-center shadow shadow-lg" style="width: 40%;">
                <div class="img-fluid pe-3">
                    <img src="{% static 'img/fm.jpg' %}" alt="" srcset="">
                </div>
                <form action="" method="post" class="text-light form-group ">
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                    <div class="alert alert-danger" role="alert">
                        {{ form.non_field_errors }}
                    </div>
                    {% endif %}
                    <div class="form-row">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" name="username" id="username" class="form-control" required>
                    </div>
                    <div class="form-row pt-2">
                        <label for="password" class="form-label">contraseña</label>
                        <input type="password" name="password" id="password" class="form-control" required>
                    </div>
                    <div class="d-flex justify-content-cente">
                        <button type="submit" class="btn btn-info mt-4">Ingresar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
