{% extends "base/base.html" %}
{% load static %}

{% block content %}



{% endblock content %}
{% block js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function leerDatos(){
            fetch('{% url "cantidad_camiones" %}')
            .then(response => response.json())
            .then(data => {
                const ctx = document.getElementById('chart').getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Cantidad de Camiones Ingresados hoy',
                            data: data.data,
                            backgroundColor: [
                                'rgba(75, 192, 192, 0.2)',
                                'rgba(255, 206, 86, 0.2)',
                                'rgba(153, 102, 255, 0.2)',
                                'rgba(255, 99, 132, 0.2)'
                            ],
                            borderColor: [
                                'rgba(75, 192, 192, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 99, 132, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        label:false,
                        borderWidth:1,
                        borderWidth:1,
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1,
                                    precision: 0
                                }
                            }
                        }
                    }
                });
            });
        }
        timer = setTimeout(leerDatos(), 1000); // Espera 1 segundo antes de la primera llamada
        
    });
</script>
{% endblock js %}
