
{% extends "transporte/transportes.html" %}
{% load static %}


{% block modal %}

    <!-- Modal -->
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="ModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="contenido">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <!-- <button type="button" class="btn btn-primary">Guardar</button> -->
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock modal %}

{% block js %}{% endblock %}
<script>
    console.log('script cargado')
    botones = document.querySelectorAll('.btn')
    botones.forEach(boton => {
        boton.addEventListener('click', function () {
            const id = boton.id
            console.log(id)
            const titulo = document.querySelector('#ModalLabel')
            const cuerpo = document.querySelector('#contenido')
            console.log(titulo)
            if (id === 'nuevaEmpresa') {
                titulo.textContent = 'Nueva Empresa de transporte'
                cuerpo.innerHTML = `
                    <form method="post" action="{% url 'agregarTransporte' %}">
                    {% csrf_token %}
                        {{ form_transporte.as_p }}
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>`
            }

            if (id === 'nuevoCamion') {
                titulo.textContent = 'Nuevo Camion'
                cuerpo.innerHTML = `
                    <form method="post" action="{% url 'agregarCamion' %}">
                    {% csrf_token %}
                        {{ form_camion.as_p }}
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>`
            }
            if (id === 'nuevoSemi') {
                titulo.textContent = 'Nuevo Semi'
                cuerpo.innerHTML = `
                    <form method="post" action="{% url 'agregarSemi' %}">
                    {% csrf_token %}
                        {{ form_semi.as_p }}
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>`
            }
        })
    });

    let tablaEmpresas = new DataTable('#tablaEmpresas',{
        responsive : true
    });
    let tablaCamiones = new DataTable('#tablaCamiones',{
        responsive : true
    });
    let tablaSemis = new DataTable('#tablaSemis',{
        responsive : true
    });
</script>
