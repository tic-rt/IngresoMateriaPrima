{% extends "base/base.html" %}
{% load static %}

{% block content %}

<div class="container card-body shadow p-3 mb-5 bg-body rounded border border-2">
    <!-- Filtros -->
    <div class="row mb-3">
        <div class="col-12 d-flex justify-content-center gap-3 flex-wrap">
            <!-- Agrupar por -->
            <div class="btn-group" role="group" aria-label="Filtro de agrupación">
                <button type="button" class="btn btn-outline-secondary active" data-filtro="producto" onclick="cambiarFiltro('producto', this)">Producto</button>
                <button type="button" class="btn btn-outline-secondary" data-filtro="proveedor" onclick="cambiarFiltro('proveedor', this)">Proveedor</button>
            </div>
            <!-- Período -->
            <div class="btn-group" role="group" aria-label="Filtro de período">
                <button type="button" class="btn btn-outline-primary active" data-periodo="hoy" onclick="cambiarPeriodo('hoy', this)">Hoy</button>
                <button type="button" class="btn btn-outline-primary" data-periodo="semana" onclick="cambiarPeriodo('semana', this)">Semanal</button>
                <button type="button" class="btn btn-outline-primary" data-periodo="mensual" onclick="cambiarPeriodo('mensual', this)">Mensual</button>
                <button type="button" class="btn btn-outline-primary" data-periodo="anual" onclick="cambiarPeriodo('anual', this)">Anual</button>
            </div>
        </div>
    </div>

    <!-- Chart -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center">
                    <h5 class="mb-0" id="chartTitle">Transportes Aceptados vs Rechazados por Producto</h5>
                </div>
                <div class="card-body d-flex justify-content-center">
                    <canvas id="chartInspecciones" width="500" height="280"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Cards -->
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card text-white bg-success shadow-sm h-100">
                <div class="card-body text-center">
                    <h2 class="card-title" id="totalAceptados">0</h2>
                    <p class="card-text mb-0">Aceptados</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card text-white bg-danger shadow-sm h-100">
                <div class="card-body text-center">
                    <h2 class="card-title" id="totalRechazados">0</h2>
                    <p class="card-text mb-0">Rechazados</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% block js %}
{{ block.super }}
<script>
// --- Dashboard Inspecciones ---
let filtroActual = 'producto';
let periodoActual = 'hoy';
let chartInspecciones = null;

function cargarDashboardInspecciones() {
    const url = `{% url 'dashboard_inspecciones' %}?filtro=${filtroActual}&periodo=${periodoActual}`;

    document.getElementById('chartTitle').textContent =
        filtroActual === 'producto'
            ? 'Transportes Aceptados vs Rechazados por Producto'
            : 'Transportes Aceptados vs Rechazados por Proveedor';

    fetch(url)
        .then(response => response.json())
        .then(data => {
            document.getElementById('totalAceptados').textContent = data.total_aceptados;
            document.getElementById('totalRechazados').textContent = data.total_rechazados;

            if (chartInspecciones) {
                chartInspecciones.destroy();
            }

            const ctx = document.getElementById('chartInspecciones').getContext('2d');
            chartInspecciones = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            label: 'Aceptados',
                            data: data.aceptados,
                            backgroundColor: '#1cc88a',
                            borderColor: '#ffffff',
                            borderWidth: 1
                        },
                        {
                            label: 'Rechazados',
                            data: data.rechazados,
                            backgroundColor: '#e74a3b',
                            borderColor: '#ffffff',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            stacked: true
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        })
        .catch(error => console.error('Error al cargar dashboard inspecciones:', error));
}

function cambiarFiltro(filtro, btn) {
    filtroActual = filtro;
    document.querySelectorAll('[data-filtro]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cargarDashboardInspecciones();
}

function cambiarPeriodo(periodo, btn) {
    periodoActual = periodo;
    document.querySelectorAll('[data-periodo]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cargarDashboardInspecciones();
}

// Cargar dashboard al iniciar
document.addEventListener('DOMContentLoaded', function() {
    cargarDashboardInspecciones();
});
</script>
{% endblock js %}
